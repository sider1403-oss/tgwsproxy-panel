name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-src/package-lock.json

      - name: Build frontend
        working-directory: frontend-src
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Package prebuilt frontend
        run: tar czf frontend-dist.tar.gz -C frontend .

      - name: Build release notes
        run: |
          python3 .github/scripts/release_notes.py "${GITHUB_REF_NAME}" > notes.md
          sed -n '1s/^TITLE: //p' notes.md > title.txt
          tail -n +2 notes.md > body.md
          cat title.txt body.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "$(cat title.txt)" \
            --notes-file body.md \
            frontend-dist.tar.gz
